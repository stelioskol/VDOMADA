<title>Η εβδομάδα μου</title>
<style>
:root{--cw:min(84vw,380px);--bg:#f6f1ff;--ink:#261c3d;--mute:#7d7399;--card:#fff;--line:#ece5f8;--shadow:0 12px 32px rgba(90,55,150,.18);--g1:hsl(285 95% 86% / .55);--g2:hsl(190 90% 82% / .45);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f22;--ink:#f5f0ff;--mute:#ab9fc9;--card:#231a36;--line:#34294b;--shadow:0 12px 32px rgba(0,0,0,.55);--g1:hsl(285 80% 40% / .35);--g2:hsl(200 80% 35% / .3)}}
:root[data-theme="dark"]{--bg:#150f22;--ink:#f5f0ff;--mute:#ab9fc9;--card:#231a36;--line:#34294b;--shadow:0 12px 32px rgba(0,0,0,.55);--g1:hsl(285 80% 40% / .35);--g2:hsl(200 80% 35% / .3)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;color:var(--ink);background:radial-gradient(circle at 5% -10%,var(--g1),transparent 45%),radial-gradient(circle at 105% 0,var(--g2),transparent 40%),var(--bg);font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
header{padding:14px 20px 4px}
h1{margin:0;font-size:29px;font-weight:800;letter-spacing:-.5px}
#mood{margin:3px 0 9px;color:var(--mute);font-size:14px;font-weight:600}
.wbar{height:9px;border-radius:9px;background:var(--line);overflow:hidden}
.wbar u{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#8b5cf6,#ec4899,#f59e0b);transition:width .6s cubic-bezier(.3,1.4,.5,1)}
#dots{display:flex;justify-content:space-between;padding:12px 20px 2px}
.dot{border:0;padding:0;width:40px;height:40px;border-radius:50%;background:conic-gradient(hsl(var(--h) 80% 55%) calc(var(--p,0)*1%),var(--line) 0);display:grid;place-items:center;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.dot span{width:32px;height:32px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--mute);transition:.2s}
.dot.on{transform:scale(1.14)}
.dot.on span{background:hsl(var(--h) 80% 55%);color:#fff}
#rail{position:relative;flex:1;min-height:0;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px calc((100vw - var(--cw))/2) 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#rail::-webkit-scrollbar{display:none}
.card{flex:0 0 var(--cw);scroll-snap-align:center;scroll-snap-stop:always;display:flex;flex-direction:column;min-height:0;background:var(--card);border-radius:30px;box-shadow:var(--shadow);overflow:hidden}
.hd{padding:18px 20px 14px;color:#fff;background:linear-gradient(140deg,hsl(var(--h) 78% 50%),hsl(calc(var(--h) + 35) 85% 58%))}
.top{display:flex;justify-content:space-between;align-items:center}
h2{margin:0;font-size:27px;font-weight:800;letter-spacing:-.4px}
small{font-size:13px;font-weight:600;opacity:.92}
small b{background:rgba(255,255,255,.28);padding:2px 9px;border-radius:20px;font-size:11px;margin-left:4px}
.big{font-size:46px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2));animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-7deg)}}
.bar{height:8px;background:rgba(255,255,255,.3);border-radius:8px;margin:13px 0 8px;overflow:hidden}
.bar u{display:block;height:100%;background:#fff;border-radius:8px;transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;min-height:26px}
.clr{border:0;background:rgba(255,255,255,.25);color:#fff;border-radius:14px;padding:5px 11px;font-size:12px;font-weight:700}
.list{list-style:none;margin:0;padding:8px 12px;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
li{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px dashed var(--line)}
li.empty{display:block;border:0;text-align:center;color:var(--mute);padding:38px 10px;font-weight:600;line-height:1.6}
.chk{flex:none;width:30px;height:30px;border-radius:50%;border:2.5px solid hsl(var(--h) 60% 72%);background:transparent;display:grid;place-items:center;padding:0;transition:.2s}
.chk svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;transform:scale(0);transition:transform .3s cubic-bezier(.3,1.9,.5,1)}
.done .chk{background:hsl(var(--h) 80% 55%);border-color:transparent}
.done .chk svg{transform:scale(1)}
.pop .chk{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.4)}}
.em{font-size:22px}
.tx{flex:1;font-size:16px;font-weight:600;line-height:1.3;word-break:break-word}
.done .tx{text-decoration:line-through;opacity:.45}
.done .em{filter:grayscale(1);opacity:.5}
.ic{flex:none;border:0;background:none;color:var(--mute);width:30px;height:30px;border-radius:50%;font-size:15px;padding:0;opacity:.75}
.add{display:flex;gap:8px;padding:10px 12px 14px;border-top:1px solid var(--line)}
.add input{flex:1;min-width:0;font:600 16px inherit;font-family:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:12px 14px;outline:0}
.add input:focus{border-color:hsl(var(--h) 80% 60%)}
.plus{flex:none;width:50px;border:0;border-radius:18px;color:#fff;font-size:28px;font-weight:700;line-height:1;padding:0;background:linear-gradient(140deg,hsl(var(--h) 78% 50%),hsl(calc(var(--h) + 35) 85% 58%));transition:transform .15s}
.plus:active{transform:scale(.9)}
.cf{position:fixed;pointer-events:none;z-index:9;font-size:20px;animation:fly .95s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rt));opacity:0}}
@media (prefers-reduced-motion:reduce){.big,.cf{animation:none}.cf{display:none}}
</style>
</head>

const D=[{n:'Δευτέρα',s:'Δ',h:262,e:'🚀'},{n:'Τρίτη',s:'Τ',h:330,e:'🎯'},{n:'Τετάρτη',s:'Τ',h:200,e:'🌊'},{n:'Πέμπτη',s:'Π',h:150,e:'🌿'},{n:'Παρασκευή',s:'Π',h:22,e:'🎉'},{n:'Σάββατο',s:'Σ',h:290,e:'🛼'},{n:'Κυριακή',s:'Κ',h:42,e:'☀️'}];
const KEY='week-cards-v1',CF=['✨','🎉','⭐','💜','🔥','🌈','🎈'],POOL=['⭐','🔥','🌈','🎈','🍀','🚀','💡','🎯','🧩','🦄'];
const MAP=[['γυμν|gym|τρεξ|workout','💪'],['καφ','☕'],['ψων|σουπερ|market','🛒'],['δουλει|meeting|σχολει|μαθημ|διαβασ','💼'],['φαγ|μαγειρ|δειπν|μεσημερ','🍝'],['φιλ|βολτ|εξοδ|ποτο','🥂'],['ραντεβ|γιατρ|οδοντ','🩺'],['πληρωμ|λογαρ|τραπεζ','💸'],['καθαρ|σπιτι|πλυντ','🧺'],['ταξιδ|πτηση|αεροπ','✈️'],['τηλεφων|καλεσ|καλω','📞'],['μουσικ|συναυλ','🎧'],['ταινι|σειρα|netflix','🍿'],['γενεθλ|δωρο','🎁'],['αγορ|παραγγ','📦']];
const PH=['π.χ. Γυμναστήριο 💪','π.χ. Καφές με φίλους ☕','π.χ. Να πάρω δώρο 🎁','π.χ. Super market 🛒','π.χ. Ραντεβού ✨','π.χ. Βόλτα στη θάλασσα 🌊','π.χ. Ταινία + ποπ κορν 🍿'];
let S={t:{}};try{S=JSON.parse(localStorage.getItem(KEY))||S}catch(e){}
S.t=S.t||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const today=(new Date().getDay()+6)%7,mon=new Date();mon.setHours(0,0,0,0);mon.setDate(mon.getDate()-today);
const rail=document.getElementById('rail'),dots=document.getElementById('dots');
let pop=null;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ς/g,'σ');
function emo(t){const m=t.match(/^\p{Extended_Pictographic}\uFE0F?/u);if(m)return[m[0],t.slice(m[0].length).trim()||t];const n=norm(t);for(const[k,e]of MAP)if(new RegExp(k).test(n))return[e,t];return[POOL[Math.random()*POOL.length|0],t]}
function burst(x,y,n){for(let k=0;k<n;k++){const s=document.createElement('span'),a=Math.random()*6.28,r=50+Math.random()*(n>8?170:80);s.className='cf';s.textContent=CF[Math.random()*CF.length|0];s.style.cssText=`left:${x}px;top:${y}px;--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r-40}px;--rt:${(Math.random()-.5)*540}deg`;document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}}
D.forEach((d,i)=>{
  const dt=new Date(mon);dt.setDate(mon.getDate()+i);d.date=dt.toLocaleDateString('el-GR',{day:'numeric',month:'short'});
  rail.insertAdjacentHTML('beforeend',`<section class="card" data-i="${i}" style="--h:${d.h}"><div class="hd"></div><ul class="list"></ul><div class="add"><input enterkeyhint="done" maxlength="80" autocomplete="off" placeholder="${PH[i]}"><button class="plus" data-a="add" aria-label="Προσθήκη">+</button></div></section>`);
  dots.insertAdjacentHTML('beforeend',`<button class="dot" data-i="${i}" style="--h:${d.h}" aria-label="${d.n}"><span>${d.s}</span></button>`);
});
function weekly(){let t=0,n=0;for(let i=0;i<7;i++){const a=S.t[i]||[];t+=a.length;n+=a.filter(x=>x.d).length}
  const p=t?Math.round(n/t*100):0;document.getElementById('wf').style.width=p+'%';
  document.getElementById('mood').textContent=!t?'Γέμισε τη βδομάδα με πλάνα 🎈':p==100?'Όλα έτοιμα! Είσαι σταρ ⭐':p>66?`Σχεδόν εκεί! ${n}/${t} 🚀`:p>33?`Πας περίφημα! ${n}/${t} 💪`:`Ζεσταίνουμε μηχανές ${n}/${t} 🔥`}
function upd(i){
  const a=S.t[i]||[],dn=a.filter(x=>x.d).length,p=a.length?Math.round(dn/a.length*100):0,c=rail.children[i],d=D[i];
  c.querySelector('.hd').innerHTML=`<div class="top"><div><h2>${d.n}</h2><small>${d.date}${i==today?' <b>ΣΗΜΕΡΑ</b>':''}</small></div><div class="big">${d.e}</div></div><div class="bar"><u style="width:${p}%"></u></div><div class="meta"><span>${!a.length?'Άδεια μέρα':dn==a.length?'Όλα έτοιμα! 🎉':dn+'/'+a.length+' έτοιμα'}</span>${dn?'<button class="clr" data-a="clr">🧹 Καθάρισμα</button>':''}</div>`;
  c.querySelector('.list').innerHTML=a.length?a.map(x=>`<li class="${x.d?'done':''}${x.id===pop?' pop':''}" data-id="${x.id}"><button class="chk" data-a="tg" aria-label="Έγινε"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button><span class="em">${x.e}</span><span class="tx">${esc(x.t)}</span>${i<6?'<button class="ic" data-a="mv" aria-label="Στην επόμενη μέρα">➜</button>':''}<button class="ic" data-a="rm" aria-label="Διαγραφή">✕</button></li>`).join(''):`<li class="empty">Τίποτα ακόμα…<br>Γράψε κάτι παρακάτω 👇</li>`;
  dots.children[i].style.setProperty('--p',p);pop=null;weekly()}
function add(i){const c=rail.children[i],inp=c.querySelector('input'),v=inp.value.trim();if(!v)return;
  const[e,t]=emo(v);(S.t[i]=S.t[i]||[]).push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),t,e,d:false});
  inp.value='';save();upd(i);const l=c.querySelector('.list');l.scrollTop=l.scrollHeight;inp.focus()}
rail.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const c=b.closest('.card'),i=+c.dataset.i,a=b.dataset.a;
  if(a=='add')return add(i);
  const arr=S.t[i]=S.t[i]||[];
  if(a=='clr')S.t[i]=arr.filter(x=>!x.d);
  else{const li=b.closest('li'),id=li.dataset.id,k=arr.findIndex(x=>x.id==id);
    if(a=='tg'){arr[k].d=!arr[k].d;if(arr[k].d){pop=id;const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,6);if(arr.every(x=>x.d))setTimeout(()=>burst(innerWidth/2,innerHeight/3,26),150)}}
    if(a=='rm')arr.splice(k,1);
    if(a=='mv'){const[x]=arr.splice(k,1);x.d=false;(S.t[i+1]=S.t[i+1]||[]).push(x);upd(i+1)}}
  save();upd(i)});
rail.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.matches('input'))add(+e.target.closest('.card').dataset.i)});
const ctr=k=>{const c=rail.children[k];return c.offsetLeft-(rail.clientWidth-c.offsetWidth)/2};
dots.addEventListener('click',e=>{const b=e.target.closest('.dot');if(b)rail.scrollTo({left:ctr(+b.dataset.i),behavior:'smooth'})});
let tick=0;
function mark(){tick=0;let b=0,bd=1e9;for(let k=0;k<7;k++){const dd=Math.abs(rail.scrollLeft-ctr(k));if(dd<bd){bd=dd;b=k}}[...dots.children].forEach((x,k)=>x.classList.toggle('on',k==b))}
rail.addEventListener('scroll',()=>{if(!tick)tick=requestAnimationFrame(mark)},{passive:true});
if(!S.seeded&&!Object.keys(S.t).length){S.seeded=1;S.t[today]=[{id:'hello',t:'Πάτα τον κύκλο για να με τσεκάρεις!',e:'👆',d:false}];save()}
for(let i=0;i<7;i++)upd(i);
requestAnimationFrame(()=>{rail.scrollLeft=ctr(today);mark()});
</script>
</body>
</html>
